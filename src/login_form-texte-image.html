<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Cabin', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #body-id {
      font-family: 'Cabin', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f6fdfb;
    }

    .login-container {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      max-width: 800px;
      margin: 50px auto;
      margin-bottom: 0px;
      padding: 20px;
    }

    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 20px;
    }

    .welcome-text {
      color: black;
      font-size: 24px;
      font-family: 'Helvetica Bold', Arial, sans-serif;
      margin-left: 10px;
      letter-spacing: 2px; /* Espacement entre les lettres */
    }

    .welcome-text span {
      font-weight: bold;
      color: #00958E;
    }

    .login-form {
      margin-left: 20px;
    }

    .login-container img {
      margin-top: 10px;
      max-width: 200px;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 30px;
      border: 1px solid #ccc;
      color: black;
      background-color: #FAFCFC;
    }

    .login-container input[type="text"]::placeholder {
      color: #999;
      font-size: 90%;
    }

    .login-container input[type="password"]::placeholder {
      color: #999;
      font-size: 90%;
    }

    .login-container button {
      width: 50%;
      cursor: pointer;
      border-radius: 6px;
    }
    .signin-button {
      background-color: #00958E;
      color: #fff;
      border: none;
      padding: 10px;
    }
    .signup-button {
      color: black;
      background-color: white;
      border: 1px solid #00958E;
      padding: 10px;
    }
    .a-link{
      width: 100%;
      color: black;
      display: flex;
      justify-content: left;
      height: 4vh;
    }

    .botton-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 7vh; /* Adjust the height of the container as needed */
    }

    .signup-title {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 3vh; /* Adjust the height of the container as needed */
    }
  </style>
</head>

<body id="body-id">

  <div class="login-container">
    <div class="welcome-container">
      <div class="welcome-text">
        Bienvenue sur votre<br>
        plateforme <span>N°1</span> pour<br>
        les offres de <span>stage</span>
      </div>
      <img src="../assets/bienvenue.jpeg" alt="Welcome Image">
    </div>

    <div class="login-form">
      <form>
        <div class="placeholder-title">E-mail</div>
        <input type="text" placeholder="E-mail" required>

        <div class="placeholder-title">Mot de passe</div>
        <input type="password" placeholder="Password" required>

        <a class="a-link" href="#">Mot de passe oublié ?</a>

        <div class="botton-container">
          <button class="signin-button" type="submit">Se connecter</button>
        </div>

        <div class="signup-title">Nouveau sur Traineeng ?</div>
        <div class="botton-container">
          <button class="signup-button" type="submit">S'inscrire</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
