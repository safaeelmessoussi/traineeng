<!DOCTYPE html>
<html>
<head>
  <style>

  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@250&family=Cabin&display=swap');

  #body-id {
      background-color: #f6fdfb;
      margin-left: 12%;
      margin-right: 12%;
      font-family: "Assistant";
    }

button{
  font-family: "Assistant";
  font-weight: 900;
}
    
  .topPage{
    display: flex;
    margin-top: 30px;
    align-items: center;
    justify-content: center;
  }

  .filters{
    padding-left:1%;
    padding-right:1%;
    text-align: left;
    flex: 3;
  }
  .suggestions{
    flex: 1;
  }

  #bSuggestions{
    background-color: #00958E;
    color: #FFFFFF;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    cursor: pointer;
    border-radius: 6px;
    width: 50%;
  }
  #bFilter{
    background-color: #FFFFFF;
    color: #00958E;
    border: 1px solid #00958E;
    padding-top: 10px;
    padding-bottom: 10px;
    cursor: pointer;
    border-radius: 6px;
    width: 15%;
    margin-right: 3px;
    text-align: left;
  }
  #bApply{
    background-color: #00958E;
    color: #FFFFFF;
    padding-top: 10px;
    padding-bottom: 10px;
    cursor: pointer;
    border-radius: 25px;
    border: none;
    margin-right: 70px;
    margin-left: 70px;
    text-align: left;
    flex-basis:15%;
    font-size: 14px;
  }
  #bFilter:hover, #bSuggestions:hover, #bApply:hover {
      background-color: #007977;
      color:#FFFFFF
    }
  #bFilter:focus{
    background-color: #00958E;
    color:#FFFFFF
  }

  .offer {
    border: 1px solid rgb(237, 235, 235);
    background-color: #FFFFFF;
    padding-top:2%;
    padding-bottom:2%;
    padding-left:7px;
    text-align: left;
    margin:0.5%;
    display: flex;
    height: 40px;
    align-items: center;
  }
  .imageLogo{
    max-width: 70px;
    max-height: 70px;
    height:auto;
    width: auto;
  }

  .iconFilterList{
    max-width: 30px;
    max-height: 30px;
    height:auto;
    width: auto;
  }

  .offerText{
    margin-left: 7px;
    flex-basis:40%;
  }

  #filterIconOffer{
    margin-left: 5px;
    flex-basis:5%;
  }

  #bFavorite {
    display: none;
  }

  #bFavorite:checked + label .initial-icon {
    display: none;
  }

  #bFavorite + label .clicked-icon {
    display: none;
  }

  #bFavorite:checked + label .clicked-icon {
    display: inline-block;
  }

  ion-icon {
  font-size: 22px;
}
  
  </style>
</head>
<!-- load icons module -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>


<body id="body-id">

<div class="topPage">
  <div class="filters">
    <button type="button" id="bFilter">
      <ion-icon name="briefcase-outline"></ion-icon>
      Domaine
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="earth-outline"></ion-icon>
      Pays
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="business-outline"></ion-icon>
      Ville
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="cash-outline"></ion-icon>
      Rémuneration
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="leaf-outline"></ion-icon>
      Green Cert.
    </button>
  </div>
  <div class="suggestions" style="text-align: right;">
    <button type="submit" id="bSuggestions">Offres suggérées pour votre profil</button>
  </div>
</div>

<div class="allOffers">

  <!-- offer start -->
  <div class="offer">
    <img class="imageLogo" src="../assets/UBS_Logo_SVG.svg.png" alt="Entreprise logo">
    <div class="offerText">
      <font size="3">UBS AG</font>
      <br> <font size="4.5"><b>Risk Analyst</b>, Zurich </font>
    </div>
    <ion-icon id="filterIconOffer" name="cash-outline" style="color: rgb(128, 128, 128); font-size:30px;"></ion-icon>
    <ion-icon id="filterIconOffer" name="leaf-outline" style="color: green; font-size:30px;"></ion-icon>
    <button type="button" id="bApply" style="text-align:right;">
      Postuler
      <ion-icon name="checkmark-circle-outline"></ion-icon>
    </button>
    
    <input type="checkbox" id="bFavorite" style="text-align:right;">
      <label for="bFavorite">
        <span class="initial-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark-outline"></ion-icon></span>
        <span class="clicked-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark"></ion-icon></span>
      </label> 
  </div>
  <!-- offer end -->


    <!-- offer start -->
    <div class="offer">
      <img class="imageLogo" src="../assets/fleurDePains.png" alt="Entreprise logo">
      <div class="offerText">
        <font size="3">Fleur de Pains</font>
        <br> <font size="4.5"><b>Vendeurs-ses/Gestionnaires du commerce de détail</b>, Lausanne </font>
      </div>
      <ion-icon id="filterIconOffer" name="cash-outline" style="color: rgb(128, 128, 128); font-size:30px;"></ion-icon>
      <ion-icon id="filterIconOffer" name="leaf-outline" style="color: green; font-size:30px;"></ion-icon>
      <button type="button" id="bApply" style="text-align:right;">
        Postuler
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </button>
      
      <input type="checkbox" id="bFavorite" style="text-align:right;">
        <label for="bFavorite">
          <span class="initial-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark-outline"></ion-icon></span>
          <span class="clicked-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark"></ion-icon></span>
        </label> 
    </div>
    <!-- offer end -->

</div>


</body>
</html>
