<!DOCTYPE html>
<html>
<head>
  <style>

  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@250&family=Cabin&display=swap');

  #body-id {
      background-color: #f6fdfb;
      margin-left: 12%;
      margin-right: 12%;
      font-family: "Assistant";
    }

  button{
    font-family: "Assistant";
    font-weight: 600;
  }
    
  .topPage{
    display: flex;
    margin-top: 30px;
    align-items: center;
    justify-content: center;
  }

  .filters{
    text-align: left;
    flex: 3;
    align-items: center;
  }
  .suggestions{
    flex: 1;
    text-align: right;
  }

  #bSuggestions{
    background-color: #00958E;
    color: #FFFFFF;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    cursor: pointer;
    border-radius: 6px;
    width: 50%;
  }
  #bFilter{
    background-color: #FFFFFF;
    color: #00958E;
    border: 1px solid #00958E;
    padding-top: 10px;
    padding-bottom: 10px;
    cursor: pointer;
    border-radius: 6px;
    width: 15%;
    margin-right: 3px;
    text-align: left;
    position: relative;
  }

  #bApply{
    background-color: #00958E;
    color: #FFFFFF;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 15px;
    cursor: pointer;
    border-radius: 25px;
    border: none;
    margin-right: 70px;
    margin-left: 70px;
    text-align: left;
    flex-basis:15%;
    font-size: 14px;
    position: relative;
  }
  #bFilter:hover, #bSuggestions:hover, #bApply:hover {
      background-color: #007977;
      color:#FFFFFF
    }
  #bFilter:focus{
    background-color: #00958E;
    color:#FFFFFF;
  }

  #bFilter ion-icon {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
  }

 #bApply ion-icon {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
  }

  .filterText {
    display: inline-block;
    margin-left: 25px;
  }

  .offer {
    border: 1px solid rgb(237, 235, 235);
    background-color: #FFFFFF;
    padding-top:2%;
    padding-bottom:2%;
    padding-left:7px;
    padding-right:7px;
    text-align: left;
    margin-top:0.5%;
    margin-bottom:0.5%;
    display: flex;
    height: 40px;
    align-items: center;
    position:relative;
  }
  .imageLogo{
    max-width: 70px;
    max-height: 70px;
    height:auto;
    width: auto;
  }

  .iconFilterList{
    max-width: 30px;
    max-height: 30px;
    height:auto;
    width: auto;
  }

  .offerText{
    margin-left: 7px;
    flex-basis:40%;
  }

  #filterIconOffer{
    margin-left: 5px;
    flex-basis:5%;
  }

  .bFavorite{
    margin-left: auto;
  }

  #bBookmark {
    display: none;
  }

  #bBookmark:checked + label .initial-icon {
    display: none;
  }

  #bBookmark + label .clicked-icon {
    display: none;
  }

  #bBookmark:checked + label .clicked-icon {
    display: inline-block;
  }

  ion-icon {
  font-size: 22px;
  position: relative;
}


  </style>
</head>
<!-- load icons module -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>


<body id="body-id">

<div class="topPage">
  <div class="filters">
    <button type="button" id="bFilter">
      <ion-icon name="briefcase-outline"></ion-icon>
      <span class="filterText">Domaine</span>
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="earth-outline"></ion-icon>
      <span class="filterText">Pays</span>
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="business-outline"></ion-icon>
      <span class="filterText">Ville</span>
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="cash-outline"></ion-icon>
      <span class="filterText">Rémuneration</span>
    </button>
    <button type="button" id="bFilter">
      <ion-icon name="leaf-outline"></ion-icon>
      <span class="filterText">Green Cert.</span>
    </button>
  </div>
  <div class="suggestions">
    <button type="submit" id="bSuggestions">Offres suggérées pour votre profil</button>
  </div>
</div>

<div class="allOffers">

  <!-- offer start -->
  <div class="offer">
    <img class="imageLogo" src="../assets/UBS_Logo_SVG.svg.png" alt="Entreprise logo">
    <div class="offerText">
      <font size="">UBS AG</font>
      <br> <font size="4.5"><b>Risk Analyst</b>, Zurich </font>
    </div>
    <ion-icon id="filterIconOffer" name="cash-outline" style="color: rgb(128, 128, 128); font-size:30px;"></ion-icon>
    <ion-icon id="filterIconOffer" name="leaf-outline" style="color: green; font-size:30px;"></ion-icon>
    <button type="button" id="bApply" style="text-align:left;">
      Postuler
      <ion-icon name="checkmark-circle-outline" style="position: absolute; right: 5px;"></ion-icon>
    </button>
    
    <div class="bFavorite">
      <input type="checkbox" id="bBookmark" style="text-align:right;">
      <label for="bBookmark">
        <span class="initial-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark-outline"></ion-icon></span>
        <span class="clicked-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark"></ion-icon></span>
      </label> 
    </div>

  </div>
  <!-- offer end -->


    <!-- offer start -->
    <div class="offer">
      <img class="imageLogo" src="../assets/fleurDePains.png" alt="Entreprise logo">
      <div class="offerText">
        <font size="3">Fleur de Pains</font>
        <br> <font size="4.5"><b>Vendeurs-ses/Gestionnaires du commerce de détail</b>, Lausanne </font>
      </div>
      <ion-icon id="filterIconOffer" name="cash-outline" style="color: rgb(128, 128, 128); font-size:30px;"></ion-icon>
      <ion-icon id="filterIconOffer" name="" style="color: green; font-size:30px;"></ion-icon>
      <button type="button" id="bApply" style="text-align:left;">
        Postuler
        <ion-icon name="checkmark-circle-outline" style="position: absolute; right: 5px;"></ion-icon>
      </button>
      
    <div class="bFavorite">
      <input type="checkbox" id="bBookmark" style="text-align:right;">
      <label for="bBookmark">
        <span class="initial-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark-outline"></ion-icon></span>
        <span class="clicked-icon"><ion-icon style="color: rgba(219, 190, 96, 0.8)" name="bookmark"></ion-icon></span>
      </label> 
    </div>

    </div>
    <!-- offer end -->

</div>


</body>
</html>
