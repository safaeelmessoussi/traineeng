<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@500&family=Cabin&display=swap');

    body {
      background-color: #f6fdfb;
    }

    .footer {
      font-family: 'Assistant', Arial, sans-serif; /* Utilisation de la police Cabin */
      margin: 2px;
      padding: 20px;
      margin-left: 10%;
      margin-right: 10%;
      background-color: #f6fdfb;
      border-top: 1px solid #00958E;
      letter-spacing: 1px;
    }

    .footer-link {
      display: block;
      margin-bottom: 10px;
      color: black;
      text-decoration: none;
      font-weight: normal;
    }

    .container {
      display: flex;
      align-items: center;
    }

    .container.icons {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px; /* Ajustez cette valeur pour définir l'espace entre les icônes et le texte du copyright */
    }

    .same-size-image {
      width: auto;
      height: 1.1em;
      vertical-align: middle;
      margin-bottom: 0.5em;
      margin-right: 5px; /* Ajustez cette valeur pour définir l'espace entre le texte et l'image */
    }

    .same-size-image-reseaux {
      width: 1.5em; /* Ajustez cette valeur pour définir la taille des icônes */
      height: 1.5em; /* Ajustez cette valeur pour définir la taille des icônes */
      margin: 0 4px; /* Ajustez cette valeur pour définir l'espace entre les icônes */
    }

    .footer-link-langue {
      display: flex;
      align-items: center;
    }

    .footer-link-langue a {
      margin-right: 5px; /* Ajustez cette valeur pour définir l'espace entre les liens */
    }

    .footer-link-langue img {
      vertical-align: middle;
    }

    .footer-copyright {
      font-size: 12px;
      text-align: center;
      width: 100%; /* Pour centrer le texte sur toute la largeur */
    }

    .footer-link.footer-copyright {
      margin-top: 0px; /* Ajustez cette valeur pour définir l'espace entre les icônes et le copyright */
    }
    
  </style>
</head>
<body>
  <footer class="footer">
    <div class="container footer-link-langue">
      <a class="footer-link" href="language.html">Langue</a>
      <a href="language.html"><img src="../../assets/planete.png" alt="Langue" class="same-size-image"></a>
    </div>
    <div class="container">
      <a class="footer-link" href="about.html">À propos</a>
    </div>
    <div class="container">
      <a class="footer-link" href="settings.html">Paramètres</a>
    </div>
    <div class="container">
      <a class="footer-link" href="contact.html">Contactez-nous</a>
    </div>
    <div class="container">
      <a class="footer-link" href="blog.html">Blog</a>
    </div>
    <div class="container icons">

        <a class="footer-link" href="https://instagram.com">
          <img src="../../assets/instagram.png" alt="Instagram" class="same-size-image-reseaux">
        </a>
        <a class="footer-link" href="https://facebook.com">
          <img src="../../assets/facebook.png" alt="Facebook" class="same-size-image-reseaux">
        </a>
        <a class="footer-link" href="https://twitter.com">
          <img src="../../assets/twitter.png" alt="Twitter" class="same-size-image-reseaux">
        </a>
        <a class="footer-link" href="https://linkedin.com">
          <img src="../../assets/linkedin.png" alt="Linkedin" class="same-size-image-reseaux">
        </a>

    </div>
    <div class="container">
      <p class="footer-link footer-copyright">© 2023 Traineeng</p>
    </div>
  </footer>
</body>
</html>
