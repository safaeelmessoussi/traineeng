<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #f6fdfb;
      color: #fff;
      padding: 10px;
    }

    .logo {
      float: left;
      margin-right: 20px;
    }

    .menu {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    .menu li {
      display: inline-block;
      margin-right: 10px;
    }

    #searchbar {
      background-color: #fff;
      width: 300px;
      height: 44px;
      border-radius: 5px;
      border-color: #00958E;
      display: flex;
      flex-direction: row;
      align-items: center;
      
    }

    input {
      all: unset;
      font: 16px system-ui;
      color: #fff;
      height: 100%;
      width: 100%;
      padding: 6px 10px;
      border: #fff;
    }

    ::placeholder {
      color: #fff;
      opacity: 0.7; 
    }
    

  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="../assets/logo.jpg" alt="Logo" height="60">
    </div>
    <nav>
      <ul class="menu">
        <li><a href="#">Fil d'actualité</a></li>
        <li><a href="#">Mes entretiens</a></li>
        <li><a href="#">Offres de stages</a></li>
        <li><a href="#">Entreprises</a></li>
        <li><a href="#">Candidats</a></li>
        <li><a href="#">Profil</a></li>
      </ul>
    </nav>

    <form id="searchbar" role="search"> 
      <input type="search" id="query" placeholder="Recherchez offres, entreprises...">
      <button>
        <img src="../assets/search_icon.jpg" alt="SearchIcon">
      </button>
    </form>

  </header>

</body>
</html>
